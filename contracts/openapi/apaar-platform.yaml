openapi: 3.1.0
info:
  title: NiyamSetu | Admission Integrity & Policy Registry
  version: 0.6.0-draft
  description: >-
    Product-owned NiyamSetu draft for institution submission, decision tracking
    and purpose-limited verification. This is not an official AICTE or APAAR API.
  license:
    name: Internal draft - licence selection pending
    identifier: LicenseRef-Internal-Draft
servers:
  - url: /
    description: current deployment
security:
  - oauth2: []
paths:
  /v1/verification-key:
    get:
      operationId: getVerificationPublicKey
      summary: Read the independent local issuer public verification key
      description: The key establishes this independent local issuer only. It does not establish government or degree-awarding authority.
      responses:
        '200':
          description: Current independent issuer key
          content:
            application/json:
              schema:
                type: object
                required: [keyId, pem, algorithm, issuer]
                properties:
                  keyId: { type: string }
                  pem: { type: string }
                  algorithm: { type: string, const: Ed25519 }
                  issuer: { type: string }
        '401': { description: Authentication required }
        '403': { description: Role not permitted }
        '503': { description: Verification key is unavailable }
  /v1/admissions/{admissionReference}/record.html:
    get:
      operationId: downloadPrintableAdmissionRecord
      summary: Download an independent printable admission record
      description: Includes separate student-ID and academic-identity fields, with absent institution student IDs explicitly marked. This synthetic record is not a degree or government credential.
      parameters:
        - { name: admissionReference, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Script-free printable HTML for an authorised institution or regulator
          content:
            text/html:
              schema: { type: string }
        '401': { description: Authentication required }
        '403': { description: Role not permitted }
        '404': { description: Admission is not visible }
  /v1/oversight/capacity:
    get:
      operationId: getOversightCapacity
      summary: Read paginated approval capacity and reservation reconciliation
      description: Institution users see only their institution; reviewer, checker and auditor roles can inspect cross-institution aggregates. Includes historical approval snapshots. Counts repeat per bucket and must not be summed as distinct students.
      parameters:
        - {
            name: academicYear,
            in: query,
            required: true,
            schema: { type: string, pattern: '^20[0-9]{2}-[0-9]{2}$' },
          }
        - {
            name: offset,
            in: query,
            schema: { type: integer, minimum: 0, maximum: 100000, default: 0 },
          }
      responses:
        '200':
          description: Up to 100 aggregate capacity rows and the next page offset
          content:
            application/json:
              schema:
                type: object
                required: [rows, nextOffset]
                properties:
                  rows:
                    {
                      type: array,
                      maxItems: 100,
                      items: { type: object, additionalProperties: true },
                    }
                  nextOffset: { type: [integer, 'null'] }
        '401': { description: Authentication required }
        '403': { description: Role not permitted }
        '422': { description: Invalid academic year or page }
  /v1/oversight/capacity.csv:
    get:
      operationId: exportOversightCapacity
      summary: Export the current page of identifier-minimised capacity reconciliation
      parameters:
        - {
            name: academicYear,
            in: query,
            required: true,
            schema: { type: string, pattern: '^20[0-9]{2}-[0-9]{2}$' },
          }
        - {
            name: offset,
            in: query,
            schema: { type: integer, minimum: 0, maximum: 100000, default: 0 },
          }
      responses:
        '200':
          description: CSV export of the selected page, not a full national export
          content:
            text/csv:
              schema: { type: string }
        '401': { description: Authentication required }
        '403': { description: Role not permitted }
        '422': { description: Invalid academic year or page }
  /health:
    get:
      operationId: getHealth
      summary: Report service health without exposing internal details
      security: []
      responses:
        '200':
          description: Service health
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [UP, DEGRADED]
        '503':
          description: Service is unavailable
        '429':
          description: Health polling rate limit exceeded
  /ready:
    get:
      operationId: getReadiness
      summary: Report readiness and non-sensitive dependency classes
      security: []
      responses:
        '200':
          description: The service can accept traffic
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
        '503':
          description: A required dependency is degraded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
        '429':
          description: Readiness polling rate limit exceeded
  /v1/dependencies:
    get:
      operationId: getDependencyStatus
      summary: Return redacted dependency classes to an authorised auditor
      responses:
        '200':
          description: Redacted dependency states
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DependencyStatus' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /metrics:
    get:
      operationId: getMetrics
      summary: Export identifier-safe gateway metrics to authorised operators
      responses:
        '200':
          description: Prometheus text exposition without student identifiers
          content:
            text/plain:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/integration/approval-imports:
    post:
      operationId: importApprovalManifest
      summary: Register one digest-verified effective-dated approval manifest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalImportManifest' }
      responses:
        '201':
          description: Imported or recorded as explicitly proposed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalImportResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
  /v1/notifications/process:
    post:
      operationId: processOneNotification
      summary: Process one informational outbox notification through the configured adapter
      responses:
        '200':
          description: Delivery result or an empty queue
          content:
            application/json:
              schema:
                type: object
                required: [delivery]
                properties:
                  delivery:
                    anyOf:
                      - $ref: '#/components/schemas/NotificationDelivery'
                      - type: 'null'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/institutions/{institutionId}/admission-batches:
    post:
      operationId: createAdmissionBatch
      summary: Register an upload and return its immutable receipt
      parameters:
        - $ref: '#/components/parameters/InstitutionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateBatchRequest'
      responses:
        '202':
          description: Batch accepted for validation, not proof that rows are accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchReceipt'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: Upload exceeds the documented five-megabyte limit
        '422':
          $ref: '#/components/responses/ValidationProblem'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /v1/admission-batches/templates:
    get:
      operationId: listAdmissionBatchTemplates
      summary: List product-owned CSV template versions supported for new uploads
      responses:
        '200':
          description: Supported template versions
          content:
            application/json:
              schema:
                type: object
                required: [currentVersion, versions]
                properties:
                  currentVersion: { type: string, const: '1.0' }
                  versions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TemplateVersion'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /v1/admission-batches/templates/{templateVersion}.csv:
    get:
      operationId: downloadAdmissionBatchTemplate
      summary: Download a product-owned UTF-8 CSV template
      parameters:
        - $ref: '#/components/parameters/TemplateVersion'
      responses:
        '200':
          description: Header-only CSV template
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            text/csv:
              schema: { type: string }
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/institutions/{institutionId}/admissions:
    post:
      operationId: submitAdmission
      summary: Evaluate and transactionally persist one idempotent admission command
      parameters:
        - $ref: '#/components/parameters/InstitutionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAdmissionRequest'
      responses:
        '200':
          description: Original result returned for an identical idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdmissionDecision'
        '201':
          description: Admission command evaluated and persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdmissionDecision'
        '409':
          description: The idempotency key was previously used with different request content
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
  /v1/admission-batches/{batchId}:
    get:
      operationId: getAdmissionBatch
      summary: Read batch progress and reconciled counts
      parameters:
        - $ref: '#/components/parameters/BatchId'
      responses:
        '200':
          description: Batch progress and reconciled counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchStatus'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/admission-batches/{batchId}/rows:
    get:
      operationId: listAdmissionBatchRows
      summary: List authorised row results with stable cursor pagination and filters
      parameters:
        - $ref: '#/components/parameters/BatchId'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/BatchRowStatus'
        - name: query
          in: query
          description: Case-insensitive record-key prefix; identity values are not searchable.
          schema: { type: string, maxLength: 128 }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 256 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Row-result page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchRowPage'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/admission-batches/{batchId}/rows/{recordKey}:
    get:
      operationId: getAdmissionBatchRow
      summary: Read one row result by institution-supplied stable record key
      parameters:
        - $ref: '#/components/parameters/BatchId'
        - $ref: '#/components/parameters/RecordKey'
      responses:
        '200':
          description: Row result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchRowResult'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/admission-batches/{batchId}/rows/{recordKey}/retry:
    post:
      operationId: retryAdmissionBatchRow
      summary: Authorise one bounded retry when the current row state is retryable
      parameters:
        - $ref: '#/components/parameters/BatchId'
        - $ref: '#/components/parameters/RecordKey'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [actorReference, reason, requestReference]
              properties:
                actorReference: { type: string, minLength: 1, maxLength: 128 }
                reason: { type: string, minLength: 1, maxLength: 200 }
                requestReference: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '202':
          description: Retry command accepted; this is not an admission acceptance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchRowResult'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationProblem'
  /v1/admission-batches/{batchId}/corrections.csv:
    get:
      operationId: downloadAdmissionBatchCorrections
      summary: Download formula-safe rows needing institution action
      parameters:
        - $ref: '#/components/parameters/BatchId'
      responses:
        '200':
          description: UTF-8 correction CSV generated from retained safe fields and findings
          content:
            text/csv:
              schema: { type: string }
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/admissions/{admissionReference}:
    get:
      operationId: getAdmission
      summary: Read an admission visible to the authorised caller
      parameters:
        - name: admissionReference
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Authorised admission view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdmissionDecision'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/academic-identity/verifications:
    post:
      operationId: requestAcademicIdentityVerification
      summary: Verify through the configured APAAR adapter without exposing provider details
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [academicIdentity, purpose]
              properties:
                academicIdentity: { type: string }
                purpose: { type: string, enum: [ADMISSION_LINKING, CORRECTION_REVIEW] }
      responses:
        '200':
          description: Normalised result; transient failure is not an invalid identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityVerificationResult'
        '422':
          $ref: '#/components/responses/ValidationProblem'
  /v1/institutions/{institutionId}/cases:
    get:
      operationId: listAdmissionCases
      summary: List institution-visible cases using stable cursor pagination
      parameters:
        - $ref: '#/components/parameters/InstitutionId'
        - $ref: '#/components/parameters/CaseTypeFilter'
        - $ref: '#/components/parameters/CaseStateFilter'
        - $ref: '#/components/parameters/CaseCursor'
        - $ref: '#/components/parameters/CasePageSize'
      responses:
        '200':
          description: Institution-scoped case page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasePage'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createAdmissionCase
      summary: Create one governed case in draft state
      parameters:
        - $ref: '#/components/parameters/InstitutionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCaseRequest'
      responses:
        '200':
          description: Exact idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseView'
        '201':
          description: Case created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseView'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationProblem'
  /v1/cases/{caseId}:
    get:
      operationId: getAdmissionCase
      summary: Read a case visible to the caller without exposing raw identity data
      parameters:
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: Purpose-limited case view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseView'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: saveAdmissionCaseDraft
      summary: Save mutable draft metadata with optimistic concurrency
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveDraftRequest'
      responses:
        '200':
          description: Updated case or exact idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseView'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationProblem'
  /v1/cases/{caseId}/submit:
    post:
      operationId: submitAdmissionCase
      summary: Submit a draft case for governed review
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/ExpectedVersionAction'
      responses:
        '200': { $ref: '#/components/responses/CaseActionResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
  /v1/cases/{caseId}/withdraw:
    post:
      operationId: withdrawAdmissionCase
      summary: Withdraw an eligible case without deleting its history
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/ExpectedVersionAction'
      responses:
        '200': { $ref: '#/components/responses/CaseActionResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
  /v1/cases/{caseId}/assignments:
    post:
      operationId: assignAdmissionCaseReviewer
      summary: Assign or reassign a reviewer under maker-reviewer separation rules
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignmentRequest' }
      responses:
        '200': { $ref: '#/components/responses/CaseActionResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
  /v1/cases/{caseId}/conflict-declarations:
    post:
      operationId: declareAdmissionCaseConflict
      summary: Record the assigned reviewer's conflict-of-interest declaration
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConflictDeclarationRequest' }
      responses:
        '200': { $ref: '#/components/responses/CaseActionResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
  /v1/cases/{caseId}/review-start:
    post:
      operationId: startAdmissionCaseReview
      summary: Start review by the authenticated reviewer
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/ExpectedVersionAction'
      responses:
        '200': { $ref: '#/components/responses/CaseActionResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
  /v1/cases/{caseId}/information-requests:
    post:
      operationId: requestAdmissionCaseInformation
      summary: Request bounded additional information from the institution
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InformationRequest' }
      responses:
        '200': { $ref: '#/components/responses/CaseActionResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
  /v1/cases/{caseId}/information-responses:
    post:
      operationId: supplyAdmissionCaseInformation
      summary: Supply information against a specific open request
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InformationResponse' }
      responses:
        '200': { $ref: '#/components/responses/CaseActionResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
  /v1/cases/{caseId}/recommendations:
    post:
      operationId: recommendAdmissionCaseOutcome
      summary: Record a reviewer recommendation with exact policy provenance
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecommendationRequest' }
      responses:
        '200': { $ref: '#/components/responses/CaseActionResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
  /v1/cases/{caseId}/decisions:
    post:
      operationId: decideAdmissionCase
      summary: Record an independent checker decision
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionRequest' }
      responses:
        '200': { $ref: '#/components/responses/CaseActionResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
  /v1/cases/{caseId}/correction-proposal:
    post:
      operationId: addAdmissionCaseCorrectionProposal
      summary: Add typed proposed changes without overwriting admission history
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CorrectionProposalRequest' }
      responses:
        '200': { $ref: '#/components/responses/CaseActionResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
  /v1/cases/{caseId}/evidence:
    post:
      operationId: addAdmissionCaseEvidence
      summary: Attach metadata for separately scanned evidence; file bytes are never returned here
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvidenceRequest' }
      responses:
        '200': { $ref: '#/components/responses/CaseActionResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /v1/cases/{caseId}/purpose-records:
    post:
      operationId: recordAdmissionCasePurpose
      summary: Record purpose, legal basis, recipients and retention before data use
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurposeRecordRequest' }
      responses:
        '200': { $ref: '#/components/responses/CaseActionResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
  /v1/cases/{caseId}/history:
    get:
      operationId: listAdmissionCaseHistory
      summary: Read append-only lifecycle history with stable pagination
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/CaseCursor'
