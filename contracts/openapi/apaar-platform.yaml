        '200': { $ref: '#/components/responses/PilotExecutionChanged' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
  /v1/pilot-executions/{executionReference}/stop-controls:
    post:
      operationId: setPilotExecutionStopControls
      summary: Set global, cohort or institution stop controls
      x-required-roles: [SERVICE_INTEGRATION_CLIENT]
      parameters:
        - $ref: '#/components/parameters/ExecutionReference'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion, controls, requestReference]
              properties:
                expectedVersion: { type: integer, minimum: 1 }
                controls: { $ref: '#/components/schemas/PilotStopControls' }
                requestReference: { type: string, pattern: '^SYNTH-[A-Z0-9-]+$' }
      responses:
        '200': { $ref: '#/components/responses/PilotExecutionChanged' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
  /v1/pilot-executions/{executionReference}/participation:
    post:
      operationId: recordPilotParticipation
      summary: Append institution and campus participation after membership validation
      x-required-roles: [SERVICE_INTEGRATION_CLIENT]
      parameters:
        - $ref: '#/components/parameters/ExecutionReference'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PilotParticipation' }
      responses:
        '201':
          description: Immutable institution participation record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PilotParticipation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
  /v1/pilot-executions/{executionReference}/workers:
    get:
      operationId: listPilotWorkerStatus
      summary: Read bounded worker checkpoints without sensitive identifiers in metric labels
      x-required-roles: [AICTE_REVIEWER, AICTE_CHECKER, AUDITOR, SERVICE_INTEGRATION_CLIENT]
      parameters: [{ $ref: '#/components/parameters/ExecutionReference' }]
      responses:
        '200':
          description: Durable worker state
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PilotWorkerStatus' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/pilot-executions/{executionReference}/evidence:
    post:
      operationId: recordPilotEvidence
      summary: Append a privacy-safe evidence snapshot
      x-required-roles: [SERVICE_INTEGRATION_CLIENT]
      parameters:
        - $ref: '#/components/parameters/ExecutionReference'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PilotEvidenceSnapshot' }
      responses:
        '201':
          description: Immutable evidence snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PilotEvidenceSnapshot' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
  /v1/pilot-executions/{executionReference}/expansions:
    post:
      operationId: expandPilotExecutionCohort
      summary: Create a re-gated immutable execution version from a paused cohort
      x-required-roles: [AICTE_CHECKER]
      parameters:
        - $ref: '#/components/parameters/ExecutionReference'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PilotExpansionInput' }
      responses:
        '200': { $ref: '#/components/responses/PilotExecutionChanged' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
  /v1/pilot-executions/{executionReference}/complete:
    post:
      operationId: completePilotExecution
      summary: Drain, reconcile and atomically complete the synthetic execution
      x-required-roles: [AICTE_CHECKER]
      parameters:
        - $ref: '#/components/parameters/ExecutionReference'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PilotCompletionInput' }
      responses:
        '200':
          description: Completed execution and immutable recommendation report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PilotCompletionReport' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
  /v1/pilot-executions/{executionReference}/terminate:
    post:
      operationId: terminatePilotExecution
      summary: Terminate a non-terminal synthetic execution without deleting history
      x-required-roles: [AICTE_CHECKER]
      parameters:
        - $ref: '#/components/parameters/ExecutionReference'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/ExecutionCommand' }
      responses:
        '200': { $ref: '#/components/responses/PilotExecutionChanged' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
  /v1/pilot-executions/{executionReference}/completion-report:
    get:
      operationId: getPilotCompletionReport
      summary: Read the immutable technical recommendation without making an authority decision
      x-required-roles: [AICTE_REVIEWER, AICTE_CHECKER, AUDITOR, SERVICE_INTEGRATION_CLIENT]
      parameters: [{ $ref: '#/components/parameters/ExecutionReference' }]
      responses:
        '200':
          description: Immutable completion report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PilotCompletionReport' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/institutions/{institutionId}/pilot-executions/{executionReference}/evidence:
    get:
      operationId: getInstitutionPilotEvidence
      summary: Read tenant-scoped institution evidence outside public metric labels
      x-required-roles: [INSTITUTION_OPERATOR, INSTITUTION_ADMINISTRATOR]
      parameters:
        - $ref: '#/components/parameters/InstitutionId'
        - $ref: '#/components/parameters/ExecutionReference'
      responses:
        '200':
          description: Evidence visible only to the matching institution tenant
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PilotEvidenceSnapshot' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/reference-sessions/{role}:
    get:
      operationId: getSyntheticReferenceSession
      summary: Obtain a local-only synthetic role session for reference-environment testing
      description: >-
        This endpoint is enabled only when the gateway starts in the synthetic
        reference environment. Production configuration rejects synthetic token
        mode during startup.
      x-synthetic-only: true
      security: []
      parameters:
        - name: role
          in: path
          required: true
          schema: { type: string, pattern: '^SYNTH-[A-Z0-9_-]+$' }
      responses:
        '200':
          description: Short-lived synthetic bearer token
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token: { type: string, minLength: 20 }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/events:
    get:
      operationId: listOperationalEvents
      summary: Read authorised durable operational events after a monotonic cursor
      x-required-roles: [AICTE_REVIEWER, AICTE_CHECKER, AUDITOR, INSTITUTION_OPERATOR]
      parameters:
        - name: after
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Cursor-ordered operational events as JSON or a finite SSE replay
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [sequence, eventType, aggregateType, aggregateReference, occurredAt]
                      properties:
                        sequence: { type: integer, minimum: 1 }
                        eventType: { type: string }
                        aggregateType: { type: string }
                        aggregateReference: { type: string }
                        occurredAt: { type: string, format: date-time }
                        payload: { type: object, additionalProperties: true }
                  nextCursor: { type: integer, minimum: 0 }
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://identity.example.invalid/authorize
          tokenUrl: https://identity.example.invalid/token
          scopes: {}
  parameters:
    ExecutionReference:
      name: executionReference
      in: path
      required: true
      schema: { type: string, pattern: '^SYNTH-[A-Z0-9-]+$' }
    IncidentReference:
      name: incidentReference
      in: path
      required: true
      schema: { type: string, pattern: '^SYNTH-[A-Z0-9-]+$' }
    PilotReference:
      name: pilotReference
      in: path
      required: true
      schema: { type: string, pattern: '^SYNTH-[A-Z0-9-]+$' }
    InstitutionId:
      name: institutionId
      in: path
      required: true
      schema: { type: string }
    BatchId:
      name: batchId
      in: path
      required: true
      schema: { type: string }
    RecordKey:
      name: recordKey
      in: path
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
    TemplateVersion:
      name: templateVersion
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9]+\.[0-9]+$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
    CaseId:
      name: caseId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    CaseTypeFilter:
      name: caseType
      in: query
      schema: { $ref: '#/components/schemas/CaseType' }
    CaseStateFilter:
      name: state
      in: query
      schema: { $ref: '#/components/schemas/CaseState' }
    CaseCursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 256 }
    CasePageSize:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
  requestBodies:
    ExecutionCommand:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PilotExecutionCommand' }
    PilotTransition:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [expectedVersion, reason, requestReference]
            properties:
              expectedVersion: { type: integer, minimum: 1 }
              reconciliationDrift: { type: integer, minimum: 0, default: 0 }
              reason: { type: string, minLength: 1, maxLength: 500 }
              requestReference: { type: string, pattern: '^SYNTH-[A-Z0-9-]+$' }
    ExpectedVersionAction:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExpectedVersionRequest'
  responses:
    PilotExecutionChanged:
      description: Immutable execution version or exact idempotent replay
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PilotExecution' }
    PilotChanged:
      description: Pilot state changed or exact idempotent replay
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PilotConfiguration' }
    Unauthenticated:
      description: Authentication is missing or invalid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The authenticated principal is not authorised for this action
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found or not visible to this caller
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Idempotency or lifecycle conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationProblem:
      description: Request could not be validated
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    DependencyUnavailable:
      description: A required scanner or identity provider is temporarily unavailable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    CaseActionResult:
      description: Updated case or exact idempotent replay
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CaseView'
  schemas:
    PilotExecutionInput:
      $ref: ../schemas/pilot-execution.schema.json#/$defs/PilotExecutionInput
    PilotExecution:
      $ref: ../schemas/pilot-execution.schema.json#/$defs/PilotExecution
    PilotExecutionCommand:
      $ref: ../schemas/pilot-execution.schema.json#/$defs/ExecutionCommand
    GoNoGoInput:
      $ref: ../schemas/pilot-execution.schema.json#/$defs/GoNoGoInput
    GoNoGoAssessment:
      $ref: ../schemas/pilot-execution.schema.json#/$defs/GoNoGoAssessment
    PilotStopControls:
      $ref: ../schemas/pilot-execution.schema.json#/$defs/StopControls
    PilotParticipation:
      $ref: ../schemas/pilot-execution.schema.json#/$defs/Participation
    PilotIncidentInput:
      $ref: ../schemas/pilot-execution.schema.json#/$defs/IncidentInput
    PilotWorkerStatus:
      $ref: ../schemas/pilot-execution.schema.json#/$defs/WorkerStatus
    PilotEvidenceSnapshot:
      $ref: ../schemas/pilot-execution.schema.json#/$defs/EvidenceSnapshot
    PilotExpansionInput:
      $ref: ../schemas/pilot-execution.schema.json#/$defs/ExpansionInput
    PilotCompletionInput:
      $ref: ../schemas/pilot-execution.schema.json#/$defs/CompletionInput
    PilotCompletionReport:
      $ref: ../schemas/pilot-execution.schema.json#/$defs/CompletionReport
    PilotConfigurationInput:
      $ref: ../schemas/pilot-rollout.schema.json#/$defs/PilotConfigurationInput
    PilotConfiguration:
      $ref: ../schemas/pilot-rollout.schema.json#/$defs/PilotConfiguration
    PilotReadinessInput:
      $ref: ../schemas/pilot-rollout.schema.json#/$defs/PilotReadinessInput
    PilotReadinessAssessment:
      $ref: ../schemas/pilot-rollout.schema.json#/$defs/PilotReadinessAssessment
    PilotReconciliationInput:
      $ref: ../schemas/pilot-rollout.schema.json#/$defs/PilotReconciliationInput
    PilotReconciliation:
      $ref: ../schemas/pilot-rollout.schema.json#/$defs/PilotReconciliation
    PilotMigrationInput:
      $ref: ../schemas/pilot-rollout.schema.json#/$defs/PilotMigrationInput
    PilotMigrationReceipt:
      $ref: ../schemas/pilot-rollout.schema.json#/$defs/PilotMigrationReceipt
    VerificationReceipt:
      type: object
      additionalProperties: false
      required:
        [
          verificationReference,
          issuedAt,
          expiresAt,
          claims,
          requesterOrganisation,
          purpose,
          legalBasisReference,
          keyId,
          algorithm,
          signature,
          status,
        ]
      properties:
        verificationReference: { type: string }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        claims: { type: object, additionalProperties: true }
        requesterOrganisation: { type: string }
        purpose: { type: string }
        legalBasisReference: { type: string }
        keyId: { type: string }
        algorithm: { type: string }
        signature: { type: string }
        status: { type: string, enum: [ACTIVE, EXPIRED, REVOKED] }
    DependencyState:
      type: string
      enum: [UP, DEGRADED, DISABLED]
    DependencyStatus:
      type: object
      additionalProperties: false
      required: [dependencies]
      properties:
        dependencies:
          type: object
          additionalProperties: { $ref: '#/components/schemas/DependencyState' }
    Readiness:
      allOf:
        - $ref: '#/components/schemas/DependencyStatus'
        - type: object
          required: [status]
          properties:
            status: { type: string, enum: [UP, DEGRADED] }
    ApprovalImportManifest:
      type: object
      additionalProperties: false
      required:
        [
          importReference,
          integrity,
          sourceSystem,
          sourceVersion,
          digestSha256,
          authority,
          institutionId,
          campusId,
          programmeId,
          courseId,
          effectiveFrom,
          effectiveTo,
          payload,
          supersedesImportReference,
        ]
      properties:
        importReference: { type: string, pattern: '^SYNTH-[A-Z0-9-]+$' }
        integrity:
          type: object
          additionalProperties: false
          required: [algorithm, keyId, signature]
          properties:
            algorithm: { type: string, minLength: 1, maxLength: 128 }
            keyId: { type: string, minLength: 1, maxLength: 128 }
            signature: { type: string, minLength: 32, maxLength: 8192 }
        sourceSystem: { type: string, minLength: 1, maxLength: 128 }
        sourceVersion: { type: string, minLength: 1, maxLength: 128 }
        digestSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        authority: { type: string, enum: [SOURCE_CONFIRMED, AUTHORITY_CONFIGURED, PROPOSED] }
        institutionId: { type: string }
        campusId: { type: string }
        programmeId: { type: string }
        courseId: { type: string }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: [string, 'null'], format: date }
        payload: { type: object, additionalProperties: true }
        supersedesImportReference: { type: [string, 'null'], pattern: '^SYNTH-[A-Z0-9-]+$' }
    ApprovalImportResult:
      type: object
      additionalProperties: false
      required: [importReference, replayed, status]
      properties:
        importReference: { type: string }
        replayed: { type: boolean }
        status: { type: string, enum: [IMPORTED, PROPOSED] }
    NotificationDelivery:
      type: object
      additionalProperties: false
      required: [notificationId, destinationReference, messageCode, state, attemptCount]
      properties:
        notificationId: { type: string }
        destinationReference: { type: string, pattern: '^SYNTH-[A-Z0-9-]+$' }
        messageCode: { type: string }
        state: { type: string, enum: [PENDING, DELIVERED, RETRYABLE, DEAD_LETTER] }
        attemptCount: { type: integer, minimum: 0 }
    SubmitAdmissionRequest:
      $ref: ../schemas/student-admission.schema.json
    CaseType:
      $ref: ../schemas/admission-casework.schema.json#/$defs/CaseType
    CaseState:
      $ref: ../schemas/admission-casework.schema.json#/$defs/CaseState
    PolicyAuthority:
      $ref: ../schemas/admission-casework.schema.json#/$defs/PolicyAuthority
    CreateCaseRequest:
      $ref: ../schemas/admission-casework.schema.json#/$defs/CreateCaseRequest
    CaseView:
      $ref: ../schemas/admission-casework.schema.json#/$defs/CaseView
    CasePage:
      $ref: ../schemas/admission-casework.schema.json#/$defs/CasePage
    ExpectedVersionRequest:
      $ref: ../schemas/admission-casework.schema.json#/$defs/ExpectedVersionRequest
    SaveDraftRequest:
      $ref: ../schemas/admission-casework.schema.json#/$defs/SaveDraftRequest
    AssignmentRequest:
      $ref: ../schemas/admission-casework.schema.json#/$defs/AssignmentRequest
    ConflictDeclarationRequest:
      $ref: ../schemas/admission-casework.schema.json#/$defs/ConflictDeclarationRequest
    InformationRequest:
      $ref: ../schemas/admission-casework.schema.json#/$defs/InformationRequest
    InformationResponse:
      $ref: ../schemas/admission-casework.schema.json#/$defs/InformationResponse
    RecommendationRequest:
      $ref: ../schemas/admission-casework.schema.json#/$defs/RecommendationRequest
    DecisionRequest:
      $ref: ../schemas/admission-casework.schema.json#/$defs/DecisionRequest
    CorrectionProposalRequest:
      $ref: ../schemas/admission-casework.schema.json#/$defs/CorrectionProposalRequest
    EvidenceRequest:
      $ref: ../schemas/admission-casework.schema.json#/$defs/EvidenceRequest
    PurposeRecordRequest:
      $ref: ../schemas/admission-casework.schema.json#/$defs/PurposeRecordRequest
    AppealRequest:
      $ref: ../schemas/admission-casework.schema.json#/$defs/AppealRequest
    AppealDecisionRequest:
      $ref: ../schemas/admission-casework.schema.json#/$defs/AppealDecisionRequest
    CancellationImplementationRequest:
      $ref: ../schemas/admission-casework.schema.json#/$defs/CancellationImplementationRequest
    TransferImplementationRequest:
      $ref: ../schemas/admission-casework.schema.json#/$defs/TransferImplementationRequest
    ImplementationReceipt:
      $ref: ../schemas/admission-casework.schema.json#/$defs/ImplementationReceipt
    HistoryPage:
      $ref: ../schemas/admission-casework.schema.json#/$defs/HistoryPage
    PolicyVersionView:
      $ref: ../schemas/admission-casework.schema.json#/$defs/PolicyVersionView
    CreateBatchRequest:
      type: object
      additionalProperties: false
      required: [file, templateVersion, actorReference, reason, requestReference]
      properties:
        file:
          type: string
          format: binary
          description: Product-owned UTF-8 CSV, at most 5 MB and 10,000 data rows.
        templateVersion: { type: string, const: '1.0' }
        actorReference: { type: string, minLength: 1, maxLength: 128 }
        reason: { type: string, minLength: 1, maxLength: 200 }
        requestReference: { type: string, minLength: 1, maxLength: 128 }
    BatchReceipt:
      type: object
      required: [batchId, receiptReference, receivedAt, replayed, sha256, status, templateVersion]
      properties:
        batchId: { type: string }
        receiptReference: { type: string }
        receivedAt: { type: string, format: date-time }
        replayed: { type: boolean }
        sha256: { type: string }
        status: { type: string, enum: [RECEIVED] }
        templateVersion: { type: string, const: '1.0' }
    BatchStatus:
      type: object
      required: [batchId, receiptReference, receivedAt, sha256, templateVersion, status, totals]
      properties:
        batchId: { type: string }
        receiptReference: { type: string }
        receivedAt: { type: string, format: date-time }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        templateVersion: { type: string, const: '1.0' }
        status:
          {
            type: string,
            enum: [RECEIVED, SCANNING, VALIDATING, PROCESSING, NEEDS_ACTION, COMPLETED, FAILED],
          }
        totals:
          $ref: '#/components/schemas/BatchTotals'
    BatchTotals:
      type: object
      additionalProperties: false
      required: [accepted, failedFinal, invalid, manualReview, pending, rejected, retryable, total]
      properties:
        accepted: { type: integer, minimum: 0 }
        failedFinal: { type: integer, minimum: 0 }
        invalid: { type: integer, minimum: 0 }
        manualReview: { type: integer, minimum: 0 }
        pending: { type: integer, minimum: 0 }
        rejected: { type: integer, minimum: 0 }
        retryable: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
    BatchRowStatus:
      type: string
      enum:
        [
          RECEIVED,
          VALID,
          INVALID,
          PROCESSING,
          ACCEPTED,
          REJECTED,
          MANUAL_REVIEW,
          FAILED_RETRYABLE,
          FAILED_FINAL,
        ]
    BatchRowFinding:
      type: object
      additionalProperties: false
      required: [code, severity, field, message]
      properties:
        code: { type: string, minLength: 1, maxLength: 100 }
        severity: { type: string, enum: [INFO, WARNING, REVIEW, ERROR] }
        field: { type: [string, 'null'], maxLength: 128 }
        message: { type: string, minLength: 1, maxLength: 500 }
    BatchRowResult:
      type: object
      additionalProperties: false
      required:
        [
          rowNumber,
          recordKey,
          status,
          attemptCount,
          admissionReference,
          decisionReference,
          findings,
        ]
      properties:
        rowNumber: { type: integer, minimum: 2 }
        recordKey: { type: string, minLength: 8, maxLength: 128 }
        status:
          $ref: '#/components/schemas/BatchRowStatus'
        attemptCount: { type: integer, minimum: 0, maximum: 3 }
        admissionReference: { type: [string, 'null'] }
        decisionReference: { type: [string, 'null'] }
        findings:
          type: array
          items:
            $ref: '#/components/schemas/BatchRowFinding'
    BatchRowPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BatchRowResult'
        nextCursor: { type: [string, 'null'] }
    TemplateVersion:
      type: object
      additionalProperties: false
      required: [version, current, mediaType, maximumBytes, maximumRows]
      properties:
        version: { type: string, const: '1.0' }
        current: { type: boolean }
        mediaType: { type: string, const: 'text/csv' }
        maximumBytes: { type: integer, const: 5242880 }
        maximumRows: { type: integer, const: 10000 }
    AdmissionDecision:
      type: object
      additionalProperties: false
      required:
        [
          admissionId,
          admissionReference,
          decisionId,
          outcome,
          status,
          institutionId,
          campusId,
          programmeId,
          courseId,
          academicYear,
          decisionAt,
          rulesetVersion,
          approvalSnapshotId,
          findings,
        ]
      properties:
        admissionId: { type: string }
        admissionReference: { type: [string, 'null'] }
        decisionId: { type: string }
        outcome: { type: string, enum: [ACCEPT, MANUAL_REVIEW, REJECT] }
        status: { type: string, enum: [ACCEPTED, REJECTED, UNDER_REVIEW] }
        institutionId: { type: string }
        campusId: { type: string }
        programmeId: { type: string }
        courseId: { type: string }
        academicYear: { type: string }
        decisionAt: { type: string, format: date-time }
        rulesetVersion: { type: string }
        approvalSnapshotId: { type: [string, 'null'] }
        findings:
          type: array
          items:
            $ref: '#/components/schemas/ValidationFinding'
    ValidationFinding:
      type: object
      additionalProperties: false
      required: [code, severity, authority, message]
      properties:
        code:
          type: string
          enum:
            - APPROVAL_CONFIGURATION_INVALID
            - APPROVAL_KEY_MISMATCH
            - APPROVAL_NOT_EFFECTIVE
            - APPROVAL_NOT_FOUND
            - CATEGORY_STATUS_MISMATCH
            - ELIGIBILITY_EVIDENCE_PENDING
            - ELIGIBILITY_EVIDENCE_REQUIRED
            - FN_OCI_GULF_CAPACITY_EXCEEDED
            - FN_OCI_GULF_NOT_APPROVED
            - FOREIGN_NATIONAL_COMBINED_CAPACITY_EXCEEDED
            - IDENTITY_MANUAL_REVIEW
            - IDENTITY_MISMATCH
            - IDENTITY_NOT_ELIGIBLE
            - IDENTITY_NOT_FOUND
            - IDENTITY_PROVIDER_UNAVAILABLE
            - IDENTITY_UNVERIFIED
            - IDENTITY_VERIFIED
            - LATERAL_CAPACITY_EXCEEDED
            - LATERAL_CAPACITY_SOURCE_REQUIRED
            - LATERAL_ENTRY_NOT_APPROVED
            - LATERAL_ENTRY_PROGRAMME_LEVEL_INVALID
            - MODE_NOT_REGULAR
            - NRI_CAPACITY_EXCEEDED
            - NRI_NOT_APPROVED
            - ORDINARY_CAPACITY_EXCEEDED
            - PM_USPY_COURSE_CAPACITY_EXCEEDED
            - PM_USPY_INSTITUTION_CAPACITY_EXCEEDED
            - PM_USPY_NOT_APPROVED
            - PM_USPY_PROGRAMME_LEVEL_INVALID
            - POLICY_CATEGORY_UNCONFIGURED
            - TFW_CAPACITY_EXCEEDED
            - TFW_NOT_APPROVED
            - TFW_PRECEDING_YEAR_FILL_NOT_SATISFIED
            - TFW_PROGRAMME_LEVEL_INVALID
        severity: { type: string, enum: [INFO, WARNING, REVIEW, ERROR] }
        authority:
          {
            type: string,
            enum: [SOURCE_CONFIRMED, AUTHORITY_CONFIGURED, PROPOSED, UNKNOWN_BLOCKING],
          }
        message: { type: string }
    IdentityVerificationResult:
      type: object
      required: [status, checkedAt, providerContractVersion]
      properties:
        status:
          type: string
          enum:
            [
              VERIFIED,
              NOT_FOUND,
              MISMATCH,
              TEMPORARILY_UNAVAILABLE,
              RATE_LIMITED,
              NOT_ELIGIBLE_FOR_APAAR,
              MANUAL_REVIEW,
              UNVERIFIED,
            ]
        checkedAt: { type: string, format: date-time }
        providerContractVersion: { type: string }
        providerRequestReference: { type: [string, 'null'] }
    Problem:
      type: object
      required: [type, title, status, traceId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        traceId: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              code:
                anyOf:
                  - $ref: '#/components/schemas/CaseworkProblemCode'
                  - type: string
                    pattern: '^[A-Z][A-Z0-9_]{1,99}$'
              field: { type: [string, 'null'] }
              row: { type: [integer, 'null'] }
              message: { type: string }
    CaseworkProblemCode:
      type: string
      description: Stable machine-readable codes emitted by governed casework operations.
      enum:
        - ACTION_FORBIDDEN
        - TENANT_SCOPE_DENIED
        - CASE_TRANSITION_INVALID
        - CASE_VERSION_CONFLICT
        - IDEMPOTENCY_CONFLICT
        - POLICY_AUTHORITY_REQUIRED
        - CHECKER_MUST_DIFFER_FROM_MAKER
        - CHECKER_MUST_DIFFER_FROM_REVIEWER
        - REVIEWER_MUST_DIFFER_FROM_MAKER
        - CONFLICT_OF_INTEREST
        - CORRECTION_FIELD_UNSUPPORTED
        - TARGET_CAPACITY_UNAVAILABLE
        - IMPLEMENTATION_ALREADY_COMPLETED
        - DEPENDENCY_UNAVAILABLE
        - UNAUTHENTICATED
        - REQUEST_VALIDATION_FAILED
        - CONTENT_TYPE_UNSUPPORTED
        - REQUEST_TOO_LARGE
        - REQUEST_JSON_INVALID
        - RATE_LIMIT_EXCEEDED
        - IMPORT_DIGEST_MISMATCH
        - APPROVAL_IMPORT_OVERLAP
        - LEGAL_BASIS_REQUIRED
        - VERIFICATION_PURPOSE_REQUIRED
