openapi: 3.1.0
info:
  title: APAAR Admission Registry API
  version: 0.2.0-draft
  description: >-
    Product-owned draft for institution submission, decision tracking and
    purpose-limited verification. It is not an official AICTE or APAAR API.
  license:
    name: Internal draft - licence selection pending
    identifier: LicenseRef-Internal-Draft
servers:
  - url: /
    description: current deployment
security:
  - oauth2: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Report service health without exposing internal details
      security: []
      responses:
        '200':
          description: Service health
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [UP, DEGRADED]
        '503':
          description: Service is unavailable
        '429':
          description: Health polling rate limit exceeded
  /v1/institutions/{institutionId}/admission-batches:
    post:
      operationId: createAdmissionBatch
      summary: Register an upload and return its immutable receipt
      parameters:
        - $ref: '#/components/parameters/InstitutionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateBatchRequest'
      responses:
        '202':
          description: Batch accepted for validation, not proof that rows are accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchReceipt'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: Upload exceeds the documented five-megabyte limit
        '422':
          $ref: '#/components/responses/ValidationProblem'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /v1/admission-batches/templates:
    get:
      operationId: listAdmissionBatchTemplates
      summary: List product-owned CSV template versions supported for new uploads
      responses:
        '200':
          description: Supported template versions
          content:
            application/json:
              schema:
                type: object
                required: [currentVersion, versions]
                properties:
                  currentVersion: { type: string, const: '1.0' }
                  versions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TemplateVersion'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /v1/admission-batches/templates/{templateVersion}.csv:
    get:
      operationId: downloadAdmissionBatchTemplate
      summary: Download a product-owned UTF-8 CSV template
      parameters:
        - $ref: '#/components/parameters/TemplateVersion'
      responses:
        '200':
          description: Header-only CSV template
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            text/csv:
              schema: { type: string }
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/institutions/{institutionId}/admissions:
    post:
      operationId: submitAdmission
      summary: Evaluate and transactionally persist one idempotent admission command
      parameters:
        - $ref: '#/components/parameters/InstitutionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAdmissionRequest'
      responses:
        '200':
          description: Original result returned for an identical idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdmissionDecision'
        '201':
          description: Admission command evaluated and persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdmissionDecision'
        '409':
          description: The idempotency key was previously used with different request content
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
  /v1/admission-batches/{batchId}:
    get:
      operationId: getAdmissionBatch
      summary: Read batch progress and reconciled counts
      parameters:
        - $ref: '#/components/parameters/BatchId'
      responses:
        '200':
          description: Batch progress and reconciled counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchStatus'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/admission-batches/{batchId}/rows:
    get:
      operationId: listAdmissionBatchRows
      summary: List authorised row results with stable cursor pagination and filters
      parameters:
        - $ref: '#/components/parameters/BatchId'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/BatchRowStatus'
        - name: query
          in: query
          description: Case-insensitive record-key prefix; identity values are not searchable.
          schema: { type: string, maxLength: 128 }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 256 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Row-result page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchRowPage'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/admission-batches/{batchId}/rows/{recordKey}:
    get:
      operationId: getAdmissionBatchRow
      summary: Read one row result by institution-supplied stable record key
      parameters:
        - $ref: '#/components/parameters/BatchId'
        - $ref: '#/components/parameters/RecordKey'
      responses:
        '200':
          description: Row result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchRowResult'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/admission-batches/{batchId}/rows/{recordKey}/retry:
    post:
      operationId: retryAdmissionBatchRow
      summary: Authorise one bounded retry when the current row state is retryable
      parameters:
        - $ref: '#/components/parameters/BatchId'
        - $ref: '#/components/parameters/RecordKey'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [actorReference, reason, requestReference]
              properties:
                actorReference: { type: string, minLength: 1, maxLength: 128 }
                reason: { type: string, minLength: 1, maxLength: 200 }
                requestReference: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '202':
          description: Retry command accepted; this is not an admission acceptance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchRowResult'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationProblem'
  /v1/admission-batches/{batchId}/corrections.csv:
    get:
      operationId: downloadAdmissionBatchCorrections
      summary: Download formula-safe rows needing institution action
      parameters:
        - $ref: '#/components/parameters/BatchId'
      responses:
        '200':
          description: UTF-8 correction CSV generated from retained safe fields and findings
          content:
            text/csv:
              schema: { type: string }
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/admissions/{admissionReference}:
    get:
      operationId: getAdmission
      summary: Read an admission visible to the authorised caller
      parameters:
        - name: admissionReference
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Authorised admission view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdmissionDecision'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/academic-identity/verifications:
    post:
      operationId: requestAcademicIdentityVerification
      summary: Verify through the configured APAAR adapter without exposing provider details
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [academicIdentity, purpose]
              properties:
                academicIdentity: { type: string }
                purpose: { type: string, enum: [ADMISSION_LINKING, CORRECTION_REVIEW] }
      responses:
        '200':
          description: Normalised result; transient failure is not an invalid identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityVerificationResult'
        '422':
          $ref: '#/components/responses/ValidationProblem'
  /v1/verifications:
    post:
      operationId: createPurposeLimitedVerification
      summary: Return the minimum authorised fact and a verification receipt
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [admissionReference, purpose, requestedClaims]
              properties:
                admissionReference: { type: string }
                purpose: { type: string, maxLength: 200 }
                requestedClaims:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
                    enum: [ADMISSION_EXISTS, INSTITUTION, PROGRAMME, ACADEMIC_YEAR, CURRENT_STATUS]
                consentReference: { type: [string, 'null'] }
      responses:
        '200':
          description: Purpose-limited result
          content:
            application/json:
              schema:
                type: object
                required: [verificationReference, issuedAt, claims]
                properties:
                  verificationReference: { type: string }
                  issuedAt: { type: string, format: date-time }
                  expiresAt: { type: [string, 'null'], format: date-time }
                  claims: { type: object, additionalProperties: true }
        '403':
          description: Caller is not authorised for the requested purpose or claims
        '422':
          $ref: '#/components/responses/ValidationProblem'
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://identity.example.invalid/authorize
          tokenUrl: https://identity.example.invalid/token
          scopes: {}
  parameters:
    InstitutionId:
      name: institutionId
      in: path
      required: true
      schema: { type: string }
    BatchId:
      name: batchId
      in: path
      required: true
      schema: { type: string }
    RecordKey:
      name: recordKey
      in: path
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
    TemplateVersion:
      name: templateVersion
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9]+\.[0-9]+$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
  responses:
    Unauthenticated:
      description: Authentication is missing or invalid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found or not visible to this caller
    Conflict:
      description: Idempotency or lifecycle conflict
    ValidationProblem:
      description: Request could not be validated
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    DependencyUnavailable:
      description: A required scanner or identity provider is temporarily unavailable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    SubmitAdmissionRequest:
      $ref: ../schemas/student-admission.schema.json
    CreateBatchRequest:
      type: object
      additionalProperties: false
      required: [file, templateVersion, actorReference, reason, requestReference]
      properties:
        file:
          type: string
          format: binary
          description: Product-owned UTF-8 CSV, at most 5 MB and 10,000 data rows.
        templateVersion: { type: string, const: '1.0' }
        actorReference: { type: string, minLength: 1, maxLength: 128 }
        reason: { type: string, minLength: 1, maxLength: 200 }
        requestReference: { type: string, minLength: 1, maxLength: 128 }
    BatchReceipt:
      type: object
      required: [batchId, receiptReference, receivedAt, replayed, sha256, status, templateVersion]
      properties:
        batchId: { type: string }
        receiptReference: { type: string }
        receivedAt: { type: string, format: date-time }
        replayed: { type: boolean }
        sha256: { type: string }
        status: { type: string, enum: [RECEIVED] }
        templateVersion: { type: string, const: '1.0' }
    BatchStatus:
      type: object
      required: [batchId, receiptReference, receivedAt, sha256, templateVersion, status, totals]
      properties:
        batchId: { type: string }
        receiptReference: { type: string }
        receivedAt: { type: string, format: date-time }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        templateVersion: { type: string, const: '1.0' }
        status:
          {
            type: string,
            enum: [RECEIVED, SCANNING, VALIDATING, PROCESSING, NEEDS_ACTION, COMPLETED, FAILED],
          }
        totals:
          $ref: '#/components/schemas/BatchTotals'
    BatchTotals:
      type: object
      additionalProperties: false
      required: [accepted, failedFinal, invalid, manualReview, pending, rejected, retryable, total]
      properties:
        accepted: { type: integer, minimum: 0 }
        failedFinal: { type: integer, minimum: 0 }
        invalid: { type: integer, minimum: 0 }
        manualReview: { type: integer, minimum: 0 }
        pending: { type: integer, minimum: 0 }
        rejected: { type: integer, minimum: 0 }
        retryable: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
    BatchRowStatus:
      type: string
      enum:
        [
          RECEIVED,
          VALID,
          INVALID,
          PROCESSING,
          ACCEPTED,
          REJECTED,
          MANUAL_REVIEW,
          FAILED_RETRYABLE,
          FAILED_FINAL,
        ]
    BatchRowFinding:
      type: object
      additionalProperties: false
      required: [code, severity, field, message]
      properties:
        code: { type: string, minLength: 1, maxLength: 100 }
        severity: { type: string, enum: [INFO, WARNING, REVIEW, ERROR] }
        field: { type: [string, 'null'], maxLength: 128 }
        message: { type: string, minLength: 1, maxLength: 500 }
    BatchRowResult:
      type: object
      additionalProperties: false
      required:
        [
          rowNumber,
          recordKey,
          status,
          attemptCount,
          admissionReference,
          decisionReference,
          findings,
        ]
      properties:
        rowNumber: { type: integer, minimum: 2 }
        recordKey: { type: string, minLength: 8, maxLength: 128 }
        status:
          $ref: '#/components/schemas/BatchRowStatus'
        attemptCount: { type: integer, minimum: 0, maximum: 3 }
        admissionReference: { type: [string, 'null'] }
        decisionReference: { type: [string, 'null'] }
        findings:
          type: array
          items:
            $ref: '#/components/schemas/BatchRowFinding'
    BatchRowPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BatchRowResult'
        nextCursor: { type: [string, 'null'] }
    TemplateVersion:
      type: object
      additionalProperties: false
      required: [version, current, mediaType, maximumBytes, maximumRows]
      properties:
        version: { type: string, const: '1.0' }
        current: { type: boolean }
        mediaType: { type: string, const: 'text/csv' }
        maximumBytes: { type: integer, const: 5242880 }
        maximumRows: { type: integer, const: 10000 }
    AdmissionDecision:
      type: object
      additionalProperties: false
      required:
        [
          admissionId,
          admissionReference,
          decisionId,
          outcome,
          status,
          institutionId,
          campusId,
          programmeId,
          courseId,
          academicYear,
          decisionAt,
          rulesetVersion,
          approvalSnapshotId,
          findings,
        ]
      properties:
        admissionId: { type: string }
        admissionReference: { type: [string, 'null'] }
        decisionId: { type: string }
        outcome: { type: string, enum: [ACCEPT, MANUAL_REVIEW, REJECT] }
        status: { type: string, enum: [ACCEPTED, REJECTED, UNDER_REVIEW] }
        institutionId: { type: string }
        campusId: { type: string }
        programmeId: { type: string }
        courseId: { type: string }
        academicYear: { type: string }
        decisionAt: { type: string, format: date-time }
        rulesetVersion: { type: string }
        approvalSnapshotId: { type: [string, 'null'] }
        findings:
          type: array
          items:
            $ref: '#/components/schemas/ValidationFinding'
    ValidationFinding:
      type: object
      additionalProperties: false
      required: [code, severity, authority, message]
      properties:
        code:
          type: string
          enum:
            - APPROVAL_CONFIGURATION_INVALID
            - APPROVAL_KEY_MISMATCH
            - APPROVAL_NOT_EFFECTIVE
            - APPROVAL_NOT_FOUND
            - CATEGORY_STATUS_MISMATCH
            - ELIGIBILITY_EVIDENCE_PENDING
            - ELIGIBILITY_EVIDENCE_REQUIRED
            - FN_OCI_GULF_CAPACITY_EXCEEDED
            - FN_OCI_GULF_NOT_APPROVED
            - FOREIGN_NATIONAL_COMBINED_CAPACITY_EXCEEDED
            - IDENTITY_MANUAL_REVIEW
            - IDENTITY_MISMATCH
            - IDENTITY_NOT_ELIGIBLE
            - IDENTITY_NOT_FOUND
            - IDENTITY_PROVIDER_UNAVAILABLE
            - IDENTITY_UNVERIFIED
            - IDENTITY_VERIFIED
            - LATERAL_CAPACITY_EXCEEDED
            - LATERAL_CAPACITY_SOURCE_REQUIRED
            - LATERAL_ENTRY_NOT_APPROVED
            - LATERAL_ENTRY_PROGRAMME_LEVEL_INVALID
            - MODE_NOT_REGULAR
            - NRI_CAPACITY_EXCEEDED
            - NRI_NOT_APPROVED
            - ORDINARY_CAPACITY_EXCEEDED
            - PM_USPY_COURSE_CAPACITY_EXCEEDED
            - PM_USPY_INSTITUTION_CAPACITY_EXCEEDED
            - PM_USPY_NOT_APPROVED
            - PM_USPY_PROGRAMME_LEVEL_INVALID
            - POLICY_CATEGORY_UNCONFIGURED
            - TFW_CAPACITY_EXCEEDED
            - TFW_NOT_APPROVED
            - TFW_PRECEDING_YEAR_FILL_NOT_SATISFIED
            - TFW_PROGRAMME_LEVEL_INVALID
        severity: { type: string, enum: [INFO, WARNING, REVIEW, ERROR] }
        authority:
          {
            type: string,
            enum: [SOURCE_CONFIRMED, AUTHORITY_CONFIGURED, PROPOSED, UNKNOWN_BLOCKING],
          }
        message: { type: string }
    IdentityVerificationResult:
      type: object
      required: [status, checkedAt, providerContractVersion]
      properties:
        status:
          type: string
          enum:
            [
              VERIFIED,
              NOT_FOUND,
              MISMATCH,
              TEMPORARILY_UNAVAILABLE,
              RATE_LIMITED,
              NOT_ELIGIBLE_FOR_APAAR,
              MANUAL_REVIEW,
              UNVERIFIED,
            ]
        checkedAt: { type: string, format: date-time }
        providerContractVersion: { type: string }
        providerRequestReference: { type: [string, 'null'] }
    Problem:
      type: object
      required: [type, title, status, traceId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        traceId: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              code: { type: string }
              field: { type: [string, 'null'] }
              row: { type: [integer, 'null'] }
              message: { type: string }
